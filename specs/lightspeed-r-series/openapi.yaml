                - type: array
                  items:
                    $ref: '#/components/schemas/ContactPhone'
          - type: string
            description: Empty string when the contact has none
        Emails:
          description: Object holding ContactEmail; the API returns an empty string when there are none.
          oneOf:
          - type: object
            properties:
              ContactEmail:
                oneOf:
                - $ref: '#/components/schemas/ContactEmail'
                - type: array
                  items:
                    $ref: '#/components/schemas/ContactEmail'
          - type: string
            description: Empty string when the contact has none
        Websites:
          description: Websites of the contact (shape not shown in the docs); empty string when none
