          - type: object
            properties:
              ContactAddress:
                oneOf:
                - $ref: '#/components/schemas/ContactAddress'
                - type: array
                  items:
                    $ref: '#/components/schemas/ContactAddress'
          - type: string
            description: Empty string when the contact has none
