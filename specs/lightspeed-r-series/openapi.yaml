components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authorization code. R-Series scopes mirror employee permissions; employee:all covers
        everything this spec uses.
      flows:
        authorizationCode:
          authorizationUrl: https://cloud.lightspeedapp.com/auth/oauth/authorize
          tokenUrl: https://cloud.lightspeedapp.com/auth/oauth/token
          scopes:
            employee:all: Full access as the authorizing employee
  parameters:
    limit:
      name: limit
      in: query
      description: Max records per page. 0 to 100, default 100.
      schema:
        type: string
        default: '100'
    sort:
      name: sort
      in: query
      description: Field to sort by; prefix with - for descending. Only some fields are sortable per endpoint (usually
        the ID and timeStamp).
      schema:
        type: string
    after:
      name: after
      in: query
      description: Cursor for the next page. Do not build it; follow the next URL in @attributes instead.
      schema:
        type: string
    before:
      name: before
      in: query
      description: Cursor for the previous page. Do not build it; follow the previous URL in @attributes instead.
      schema:
        type: string
    archived:
      name: archived
      in: query
      description: '"true" returns archived and active records, "false" (default) only active, "only" only archived.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        - only
        default: 'false'
    load_relations:
      name: load_relations
      in: query
      description: JSON array of relations to load, e.g. ["ItemShops","Prices"]. Each relation raises the request
        cost; "all" is for discovery only.
      schema:
        type: string
    count:
      name: count
      in: query
      description: Send 1 to get only the number of matching records in @attributes.count. Cannot be combined with
        after, before, limit or sort. Costs 10 drips.
      schema:
        type: string
        enum:
        - '1'
    giftCard:
      name: giftCard
      in: query
      description: Send true to include gift cards in the results (they are left out otherwise).
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    itemID:
      name: itemID
      in: path
      required: true
      description: Item ID. Integer ID, sent as a string.
      schema:
        type: string
    itemMatrixID:
      name: itemMatrixID
      in: path
      required: true
      description: Item matrix ID. Integer ID, sent as a string.
      schema:
        type: string
    itemAttributeSetID:
      name: itemAttributeSetID
      in: path
      required: true
      description: Item attribute set ID. Integer ID, sent as a string.
      schema:
        type: string
    manufacturerID:
      name: manufacturerID
      in: path
      required: true
      description: Manufacturer ID. Integer ID, sent as a string.
      schema:
        type: string
    customerID:
      name: customerID
      in: path
      required: true
      description: Customer ID. Integer ID, sent as a string.
      schema:
        type: string
    saleID:
      name: saleID
      in: path
      required: true
      description: Sale ID. Integer ID, sent as a string.
      schema:
        type: string
    orderID:
      name: orderID
      in: path
      required: true
      description: Purchase order ID. Integer ID, sent as a string.
      schema:
        type: string
    creditAccountID:
      name: creditAccountID
      in: path
      required: true
      description: Credit account ID. Integer ID, sent as a string.
      schema:
        type: string
    shopID:
      name: shopID
      in: path
      required: true
      description: Shop ID. Integer ID, sent as a string.
      schema:
        type: string
    transferID:
      name: transferID
      in: path
      required: true
      description: Transfer ID. Integer ID, sent as a string.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, expired or invalid access token
    RateLimited:
      description: Rate limit hit. Wait Retry-After seconds, then retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: string
        X-LS-API-RateLimit-Type:
          description: 'Which limiter blocked the request: api-leaky-bucket or api-burst-limiter'
          schema:
            type: string
  schemas:
    ListAttributes:
      type: object
      description: The @attributes block of every list response (V3 cursor paging).
      properties:
        next:
          type: string
          description: Full URL of the next page of results; empty string on the last page. Call it as given, do
            not rebuild it
        previous:
          type: string
          description: Full URL of the previous page; empty string on the first page
        count:
          type: string
          description: Total number of matching records. Only present when the request used count=1 (V3 does not
            return it by default). Integer, sent as a string.
    CountAttributes:
      type: object
      description: The @attributes block of a single-record response.
      properties:
        count:
          type: string
          description: Number of records returned (1 for a single-record response). Integer, sent as a string.
    ItemPrice:
      type: object
      properties:
        amount:
          type: string
          description: Price amount. Decimal number, sent as a string.
        useTypeID:
          type: string
          description: Price level ID (1 = Default, 2 = MSRP, 3 = Online in the docs examples; stores can add levels).
            Integer ID, sent as a string.
        useType:
          type: string
          description: Price level name, e.g. Default, MSRP, Online
    ItemPrices:
      type: object
      properties:
        ItemPrice:
          type: array
          items:
            $ref: '#/components/schemas/ItemPrice'
    ItemShop:
      type: object
      description: Inventory record of one item in one shop. Fields shown depend on the endpoint and scopes.
      properties:
        itemShopID:
          type: string
          description: ItemShop ID. Integer ID, sent as a string.
        qoh:
          type: string
          description: Quantity on hand. Negative means negative inventory. Integer, sent as a string.
        sellable:
          type: string
          description: Amount available for sale (matches qoh unless qoh is negative, then 0). Integer, sent as
            a string.
        backorder:
          type: string
          description: Amount on backorder (on a purchase order). Integer, sent as a string.
        componentQoh:
          type: string
          description: Amount that could be built or broken down from boxes in stock. Integer, sent as a string.
        componentBackorder:
          type: string
          description: Amount that could be built or broken down from boxes on order. Integer, sent as a string.
        onLayaway:
          type: string
          description: Units reserved for layaways. Integer, sent as a string.
        onSpecialOrder:
          type: string
          description: Units reserved for special orders. Integer, sent as a string.
        onWorkorder:
          type: string
          description: Units reserved for work orders. Integer, sent as a string.
        onTransferOut:
          type: string
          description: Units in transit out of this shop. Integer, sent as a string.
        onTransferIn:
          type: string
          description: Units in transit into this shop. Integer, sent as a string.
        averageCost:
          type: string
          description: Weighted average cost; only filled on the shopID 0 (account-wide) record. Decimal number,
            sent as a string.
        nextFifoLotID:
          type: string
          description: ID of the next FIFO lot. Integer ID, sent as a string.
        nextFifoLotCost:
          type: string
          description: Cost of the next FIFO lot. Decimal number, sent as a string.
        lastReceivedLotID:
          type: string
          description: ID of the last received lot. Integer ID, sent as a string.
        lastReceivedCost:
          type: string
          description: Cost of the last received lot. Decimal number, sent as a string.
        totalValueFifo:
          type: string
          description: Inventory value by FIFO. Decimal number, sent as a string.
        totalValueAvgCost:
          type: string
          description: Inventory value by average cost. Decimal number, sent as a string.
        totalValueNegativeInventory:
          type: string
          description: Value of negative inventory. Decimal number, sent as a string.
        reorderPoint:
          type: string
          description: Reorder when quantity on hand is at or below this. Integer, sent as a string.
        reorderLevel:
          type: string
          description: Desired quantity to reach when reordering. Integer, sent as a string.
        timeStamp:
          type: string
          description: Last modified. Date/time, ISO 8601.
          format: date-time
        itemID:
          type: string
          description: Item ID. Integer ID, sent as a string.
        shopID:
          type: string
          description: Shop ID. The ItemShop with shopID 0 is a summary record for all shops. Integer ID, sent as
            a string.
    ItemShops:
      type: object
      properties:
        ItemShop:
          type: array
          items:
            $ref: '#/components/schemas/ItemShop'
    ItemShopWrite:
      type: object
      properties:
        itemShopID:
          type: string
          description: ItemShop to update. Give this or shopID. Integer ID, sent as a string.
        shopID:
          type: string
          description: Shop whose record to update. Give this or itemShopID. Integer ID, sent as a string.
        qoh:
          type: string
          description: Quantity on hand to set. Integer, sent as a string.
    ItemShopsWrite:
      type: object
      description: 'Update only: set qoh of one shop. Identify the record with itemShopID or shopID.'
      properties:
        ItemShop:
          $ref: '#/components/schemas/ItemShopWrite'
    ItemAttributes:
      type: object
      description: Attribute values of an item that belongs to a matrix. Shown in responses; writing it is not documented
        (see SOURCE.md).
      properties:
        attribute1:
          type: string
          description: Value of the first attribute, e.g. White
        attribute2:
          type: string
          description: Value of the second attribute, e.g. Small
        attribute3:
          type: string
          description: Value of the third attribute
        itemAttributeSetID:
          type: string
          description: ItemAttributeSet this item follows. Integer ID, sent as a string.
    Item:
      type: object
      description: Sellable item (one SKU).
      properties:
        itemID:
          type: string
          description: Item ID. Integer ID, sent as a string.
        systemSku:
          type: string
          description: System-generated SKU
        avgCost:
          type: string
          description: Average cost. Decimal number, sent as a string.
        archived:
          type: string
          description: Whether the item is archived. "true" or "false", sent as a string.
        createTime:
          type: string
          description: Created. Date/time, ISO 8601.
          format: date-time
        timeStamp:
          type: string
          description: Last modified. Date/time, ISO 8601.
          format: date-time
        defaultCost:
          type: string
          description: Default cost of the item. Decimal number, sent as a string.
        discountable:
          type: string
          description: Whether discounts apply. "true" or "false", sent as a string.
        tax:
          type: string
          description: Whether tax applies. "true" or "false", sent as a string.
        itemType:
          type: string
          description: 'Item type, e.g. default. The ItemMatrix docs list: default, non_inventory, serialized, box,
            serialized_assembly, assembly'
        serialized:
          type: string
          description: Whether the item is serialized. "true" or "false", sent as a string.
        description:
          type: string
          description: Item description
        modelYear:
          type: string
          description: Model year (0 when unset). Integer, sent as a string.
        upc:
          type: string
          description: UPC code
        ean:
          type: string
          description: EAN code
        customSku:
          type: string
          description: Custom SKU
        manufacturerSku:
          type: string
          description: Manufacturer SKU
        publishToEcom:
          type: string
          description: Whether the item is published to e-commerce. "true" or "false", sent as a string.
        categoryID:
          type: string
          description: Category ID (0 = none). Integer ID, sent as a string.
        taxClassID:
          type: string
          description: Tax class ID. Integer ID, sent as a string.
        departmentID:
          type: string
          description: Department ID (0 = none). Integer ID, sent as a string.
        itemMatrixID:
          type: string
          description: Item matrix this item belongs to (0 = none). Integer ID, sent as a string.
        manufacturerID:
          type: string
          description: Manufacturer ID (0 = none). Integer ID, sent as a string.
        seasonID:
          type: string
          description: Season ID (0 = none). Integer ID, sent as a string.
        defaultVendorID:
          type: string
          description: Default vendor ID (0 = none). Integer ID, sent as a string.
        ItemAttributes:
          $ref: '#/components/schemas/ItemAttributes'
        ItemShops:
          $ref: '#/components/schemas/ItemShops'
        Prices:
          $ref: '#/components/schemas/ItemPrices'
    ItemWrite:
      type: object
      description: Body for creating or updating an item. Fields left out keep their value on update; a null or
        empty value clears it.
      properties:
        defaultCost:
          type: string
          description: Default cost of the item. Decimal number, sent as a string.
        discountable:
          type: string
          description: Whether discounts apply. "true" or "false", sent as a string.
        tax:
          type: string
          description: Whether tax applies. "true" or "false", sent as a string.
        itemType:
          type: string
          description: 'Item type, e.g. default. The ItemMatrix docs list: default, non_inventory, serialized, box,
            serialized_assembly, assembly'
        serialized:
          type: string
          description: Whether the item is serialized. "true" or "false", sent as a string.
        description:
          type: string
          description: Item description
        modelYear:
          type: string
          description: Model year (0 when unset). Integer, sent as a string.
        upc:
          type: string
          description: UPC code
        ean:
          type: string
          description: EAN code
        customSku:
          type: string
          description: Custom SKU
        manufacturerSku:
          type: string
          description: Manufacturer SKU
        publishToEcom:
          type: string
          description: Whether the item is published to e-commerce. "true" or "false", sent as a string.
        categoryID:
          type: string
          description: Category ID (0 = none). Integer ID, sent as a string.
        taxClassID:
          type: string
          description: Tax class ID. Integer ID, sent as a string.
        departmentID:
          type: string
          description: Department ID (0 = none). Integer ID, sent as a string.
        itemMatrixID:
          type: string
          description: Item matrix this item belongs to (0 = none). Integer ID, sent as a string.
        manufacturerID:
