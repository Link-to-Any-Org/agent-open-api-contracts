openapi: 3.0.3
info:
  title: Lightspeed Retail R-Series API (agent contract)
  version: V3
  description: |-
    Subset of the Lightspeed Retail (R-Series) API V3 used by the LINK! agent. Written from the current docs (developers.lightspeedhq.com/retail); Lightspeed publishes no OpenAPI file. Source and open questions: see SOURCE.md in this folder.

    **Account ID.** Every path lives under `/Account/{accountID}`. Call `GET /Account.json` once after OAuth to learn the ID, then set the `accountID` server variable.

    **Everything is a string.** R-Series JSON sends every scalar as a string: IDs ("12"), numbers ("4.99"), booleans ("true"/"false"). Schemas therefore type every scalar as `string` and the description says what it means. Timestamps are ISO 8601 strings. ID 0 means "none". Update calls (PUT) keep fields you leave out; a null or empty value clears the field.

    **Lists and paging (V3).** List calls return `{"@attributes": {"next", "previous"}, "<Resource>": [...]}`. Follow the full `next` URL until it is an empty string; do not build `after`/`before` yourself. Default and max page size is 100. A page with one record may come back as an object, not an array. Single records come back as `{"@attributes": {"count": "1"}, "<Resource>": {...}}`.

    **Related records.** Use `load_relations=["ItemShops","Prices"]` to load relations; each one raises the request cost.

    **Filtering.** Filters are query parameters named after the field, e.g. `?description=~,shirt%` or `?timeStamp=>=,2026-01-01T00:00:00+00:00`. Format: `field=operator,value`; the operator and comma must be URL-encoded. Operators: `=` (default), `>` , `>=`, `<`, `<=`, `><` (between: `itemID=><,1,10`), `!=`, `~` (like, % is the wildcard), `!~` (not like), `IN` (up to 100 values: `itemID=IN,[1,2,3]`), and `or` (`or=description%3Dfoo|description%3Dbar`, with `=` percent-encoded as %3D). Percent-encode values. `or` and `load_relations` raise the request cost. Not every field is filterable on every endpoint.

    **Rate limit.** Leaky bucket (bucket size 90 in the docs example) plus a per-second burst limit. Each request has a cost in drips (see `X-LS-Api-Request-Cost`). On 429, wait `Retry-After` seconds.
servers:
- url: https://api.lightspeedapp.com/API/V3/Account/{accountID}
  description: Lightspeed Retail R-Series API V3, scoped to one account
  variables:
    accountID:
      default: '0'
      description: Account ID of the merchant, from GET /Account.json after OAuth. 0 is only a placeholder.
security:
- oauth2:
  - employee:all
tags:
- name: Account
  description: Find the account ID of the connected merchant
- name: Inventory
  description: Items, stock per shop, matrices, attribute sets, manufacturers, categories, vendors and tax setup
- name: Orders
  description: Sales (with lines and payments), payment types, registers, employees and vendor purchase orders
- name: Customers
  description: Customers and their contact details
- name: Gift cards
  description: Gift cards and store-credit accounts (CreditAccount)
- name: Locations
  description: Shops (stores and warehouses)
- name: Consignments
  description: Inventory transfers between shops
- name: Images
  description: Item and item matrix images
paths:
  /Account.json:
    get:
      operationId: getAccount
      summary: Find the account ID
      tags:
      - Account
      description: Returns the account the access token belongs to. Call this once after OAuth to learn {accountID};
        every other path needs it in the server URL. This is the only call that uses the base URL without /Account/{accountID}.
      servers:
      - url: https://api.lightspeedapp.com/API/V3
        description: API root, no account ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
