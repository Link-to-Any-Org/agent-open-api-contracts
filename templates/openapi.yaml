openapi: 3.0.3
info:
  title: <Platform> API (agent contract)
  version: "<upstream API version>"
  description: |
    Subset of the <Platform> API used by the LINK! agent.
    Source and open questions: see SOURCE.md in this folder.
servers:
  - url: https://api.platform.invalid/v1
    description: Replace with the platform base URL
security:
  - oauth2: []
paths:
  /locations:
    get:
      operationId: listLocations
      summary: List locations
      tags: [Locations]
      responses:
        "200":
          description: A page of locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Location"
        "401":
          description: Missing or invalid token
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.platform.invalid/oauth/authorize
          tokenUrl: https://auth.platform.invalid/oauth/token
          scopes:
            locations:read: Read locations
  schemas:
    Location:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
tags:
  - name: Locations
    description: Store and warehouse locations
